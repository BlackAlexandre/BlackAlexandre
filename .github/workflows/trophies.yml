name: Update GitHub Trophies

on:
  schedule:
    - cron: "30 3 * * 0"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/trophies.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Trophy SVG
        uses: soulteary/github-profile-trophy-action@v1.0.0
        with:
          options: "username=${{ github.repository_owner }}&theme=algolia&column=7&margin-w=8&margin-h=8&no-bg=true&no-frame=true&rank=-?"
          path: trophy.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Save Trophy SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trophy.svg
          git commit -m "Update GitHub trophies" || exit 0
          git push
